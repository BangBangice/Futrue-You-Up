# Local development only. Railway provides its own Postgres and DATABASE_URL.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-larp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larp}
      POSTGRES_DB: ${POSTGRES_DB:-larp}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Catches the app's email. Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # The S3-compatible bucket attached files go in when STORAGE=s3, so the local stack can match production. Behind a
  # profile because the default `docker compose up` should stay as small as it was: `docker compose --profile s3 up`.
  # MinIO pulled its public images in 2025 (minio/minio and quay.io/minio/minio are both gone), so this is Pigsty's
  # maintained mirror of the same server. Point S3_ENDPOINT anywhere else, or at Railway's bucket, and it is unused.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-larp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-larp-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Makes the bucket once, so the first upload does not need the console at http://localhost:9001.
  bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set larp http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing larp/\"$$S3_BUCKET\""]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-larp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-larp-secret}
      S3_BUCKET: ${S3_BUCKET:-larp}

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-larp}:${POSTGRES_PASSWORD:-larp}@db:5432/${POSTGRES_DB:-larp}
      LLM: ${LLM:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      # With a database, sign-in is on. This secret is for local use only.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-not-for-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5183}
      MAILPIT_URL: http://mailpit:8025
      PORT: "5183"
      # Attached files stay on the volume below unless STORAGE=s3, and then they go in the bucket above. The endpoint
      # is the service name, which is only right inside this network: running the server on the host instead
      # (`npm run dev`), .env points it at http://localhost:9000.
      STORAGE: ${STORAGE:-disk}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-larp}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-larp}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-larp-secret}
    ports:
      - "127.0.0.1:5183:5183"
    volumes:
      - data:/app/.data

volumes:
  db:
  data:
  minio:
